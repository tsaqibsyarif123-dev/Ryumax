<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Guess - Web Game</title>
    <!-- Tailwind CSS CDN untuk styling cepat & rapi -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fira Code', monospace;
        }
    </style>
</head>
<body class="bg-slate-950 text-emerald-400 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-emerald-500 selection:text-black">

    <div class="w-full max-w-md bg-slate-900 border border-emerald-500/30 rounded-2xl p-6 shadow-2xl shadow-emerald-950/50">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-wider text-emerald-400">⚡ CYBER_GUESS</h1>
            <p class="text-xs text-slate-400 mt-1">Decrypt the target system passcode.</p>
        </div>

        <!-- Score & Status Bar -->
        <div class="grid grid-cols-3 gap-2 mb-6 text-center text-xs">
            <div class="bg-slate-950 p-2 rounded-lg border border-slate-800">
                <span class="block text-slate-500">SCORE</span>
                <span id="score" class="text-base font-bold text-emerald-400">0</span>
            </div>
            <div class="bg-slate-950 p-2 rounded-lg border border-slate-800">
                <span class="block text-slate-500">STREAK</span>
                <span id="streak" class="text-base font-bold text-amber-400">0</span>
            </div>
            <div class="bg-slate-950 p-2 rounded-lg border border-slate-800">
                <span class="block text-slate-500">CHANCES</span>
                <span id="chances" class="text-base font-bold text-rose-400">5</span>
            </div>
        </div>

        <!-- Game Area -->
        <div id="game-area" class="space-y-4">
            <div class="text-center bg-slate-950/60 p-4 rounded-xl border border-emerald-500/20">
                <p id="instruction" class="text-sm text-slate-300">Pilih rentang angka, lalu mulai game!</p>
                <div id="range-info" class="text-xs text-emerald-500/80 mt-1">Target: 1 - 50</div>
            </div>

            <!-- Difficulty Selector -->
            <div id="setup-section" class="space-y-3">
                <label class="block text-xs text-slate-400 uppercase tracking-wider">Pilih Level Enkripsi:</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="startGame(1)" class="py-2 bg-emerald-950/40 hover:bg-emerald-900/50 border border-emerald-500/40 rounded-lg text-xs font-semibold transition cursor-pointer">Easy (1-25)</button>
                    <button onclick="startGame(2)" class="py-2 bg-emerald-950/40 hover:bg-emerald-900/50 border border-emerald-500/40 rounded-lg text-xs font-semibold transition cursor-pointer">Medium (1-50)</button>
                    <button onclick="startGame(3)" class="py-2 bg-emerald-950/40 hover:bg-emerald-900/50 border border-emerald-500/40 rounded-lg text-xs font-semibold transition cursor-pointer">Hard (1-100)</button>
                </div>
            </div>

            <!-- Guess Input Section (Hidden initially) -->
            <div id="play-section" class="hidden space-y-3">
                <div class="flex gap-2">
                    <input type="number" id="user-guess" placeholder="Masukkan angka..." class="w-full bg-slate-950 border border-emerald-500/40 rounded-xl px-4 py-3 text-emerald-300 focus:outline-none focus:border-emerald-400 text-center text-lg font-bold">
                    <button onclick="checkGuess()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-5 rounded-xl transition cursor-pointer">TEBAK</button>
                </div>
                <button onclick="resetGame()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs transition cursor-pointer">Kembali ke Menu</button>
            </div>

            <!-- Feedback Message -->
            <div id="message" class="text-center text-xs font-semibold min-h-[24px] text-slate-400"></div>
        </div>
    </div>

    <!-- Script Game Logic -->
    <script>
        let targetNumber = 0;
        let maxRange = 50;
        let chances = 5;
        let score = 0;
        let streak = 0;
        let gameActive = false;

        const scoreEl = document.getElementById('score');
        const streakEl = document.getElementById('streak');
        const chancesEl = document.getElementById('chances');
        const instructionEl = document.getElementById('instruction');
        const rangeInfoEl = document.getElementById('range-info');
        const messageEl = document.getElementById('message');
        const setupSection = document.getElementById('setup-section');
        const playSection = document.getElementById('play-section');
        const userGuessInput = document.getElementById('user-guess');

        function startGame(level) {
            if (level === 1) maxRange = 25;
            else if (level === 2) maxRange = 50;
            else if (level === 3) maxRange = 100;

            targetNumber = Math.floor(Math.random() * maxRange) + 1;
            chances = level === 3 ? 7 : (level === 2 ? 5 : 4);
            gameActive = true;

            rangeInfoEl.innerText = `Target: 1 - ${maxRange}`;
            instructionEl.innerText = `Sistem terkunci! Tebak angka antara 1 sampai ${maxRange}.`;
            messageEl.innerText = "";
            messageEl.className = "text-center text-xs font-semibold min-h-[24px] text-slate-400";

            chancesEl.innerText = chances;
            setupSection.classList.add('hidden');
            playSection.classList.remove('hidden');
            userGuessInput.value = '';
            userGuessInput.focus();
        }

        function checkGuess() {
            if (!gameActive) return;

            const guess = parseInt(userGuessInput.value);

            if (isNaN(guess) || guess < 1 || guess > maxRange) {
                messageEl.innerText = `⚠️ Masukkan angka valid (1 - ${maxRange})!`;
                messageEl.className = "text-center text-xs font-semibold min-h-[24px] text-amber-400";
                return;
            }

            chances--;
            chancesEl.innerText = chances;

            if (guess === targetNumber) {
                score += (chances + 1) * 10;
                streak++;
                scoreEl.innerText = score;
                streakEl.innerText = streak;
                messageEl.innerText = `🎉 ACCESS GRANTED! Angka benar: ${targetNumber}`;
                messageEl.className = "text-center text-xs font-semibold min-h-[24px] text-emerald-400";
                endGame(true);
            } else if (chances === 0) {
                streak = 0;
                streakEl.innerText = streak;
                messageEl.innerText = `❌ SYSTEM LOCKED! Angka yang benar adalah ${targetNumber}.`;
                messageEl.className = "text-center text-xs font-semibold min-h-[24px] text-rose-500";
                endGame(false);
            } else if (guess < targetNumber) {
                messageEl.innerText = `📈 Terlalu KECIL! Sisa kesempatan: ${chances}`;
                messageEl.className = "text-center text-xs font-semibold min-h-[24px] text-sky-400";
            } else {
                messageEl.innerText = `📉 Terlalu BESAR! Sisa kesempatan: ${chances}`;
                messageEl.className = "text-center text-xs font-semibold min-h-[24px] text-amber-400";
            }

            userGuessInput.value = '';
            userGuessInput.focus();
        }

        function endGame(won) {
            gameActive = false;
            playSection.innerHTML = `
                <button onclick="location.reload()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-sm transition cursor-pointer">MAIN LAGI</button>
            `;
        }

        // Enter key support
        userGuessInput.addEventListener("keypress", function(event) {
            if (event.key === "KeyEnter" || event.key === "Enter") {
                checkGuess();
            }
        });
    </script>
</body>
</html>
